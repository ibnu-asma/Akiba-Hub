services:
  postgres:
    image: postgres:16-alpine
    container_name: a2sv-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: a2sv_hub
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d a2sv_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hub-postgres-data:/var/lib/postgresql/data

volumes:
  hub-postgres-data:
