name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm build
        env:
          NODE_ENV: production
          API_URL: https://api.akibatech.com

      - name: Prepare Web Deployment Package
        run: |
          mkdir -p deploy-web
          cp -r apps/web/.next/standalone/* deploy-web/
          mkdir -p deploy-web/apps/web/.next
          cp -r apps/web/.next/static deploy-web/apps/web/.next/
          if [ -d "apps/web/public" ]; then
            cp -r apps/web/public deploy-web/apps/web/
          fi
          cat << 'EOF' > deploy-web/server.js
          process.env.NODE_ENV = 'production';
          process.env.PORT = process.env.PORT || 3000;
          process.env.API_URL = process.env.API_URL || 'https://api.akibatech.com';
          import('./apps/web/server.js');
          EOF
          node -e "
            const fs = require('fs');
            const file = 'deploy-web/package.json';
            const pkg = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
            pkg.type = 'module';
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
          "
          mkdir -p deploy-web/tmp
          touch deploy-web/tmp/restart.txt

      - name: Prepare API Deployment Package
        run: |
          mkdir -p deploy-api
          npx esbuild apps/api/src/main.ts \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --outfile=deploy-api/server.js \
            --external:@nestjs/* \
            --external:bcryptjs \
            --external:drizzle-orm \
            --external:jsonwebtoken \
            --external:nodemailer \
            --external:pg \
            --external:reflect-metadata \
            --external:rxjs \
            --external:zod

          cat << 'EOF' > deploy-api/package.json
          {
            "name": "hub-api",
            "version": "1.0.0",
            "type": "module",
            "main": "server.js",
            "dependencies": {
              "@nestjs/common": "^12.0.1",
              "@nestjs/config": "^12.0.0",
              "@nestjs/core": "^12.0.1",
              "@nestjs/platform-express": "^12.0.1",
              "bcryptjs": "^3.0.3",
              "drizzle-orm": "^0.45.2",
              "jsonwebtoken": "^9.0.3",
              "nodemailer": "^6.10.0",
              "pg": "^8.23.0",
              "reflect-metadata": "^0.2.2",
              "rxjs": "^7.8.2",
              "zod": "^4.6.1"
            }
          }
          EOF

          cd deploy-api && npm install --omit=dev --no-audit --no-fund
          cd ..

          mkdir -p deploy-api/tmp
          touch deploy-api/tmp/restart.txt

      - name: Deploy Web to cPanel (hub-web)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./deploy-web/
          server-dir: hub-web/

      - name: Deploy API to cPanel (hub-api)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./deploy-api/
          server-dir: hub-api/
