name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: pnpm build
        env:
          NODE_ENV: production
          API_URL: https://api.akibatech.com

      - name: Prepare Web Deployment Package
        run: |
          mkdir -p deploy-web
          cp -r apps/web/.next/standalone/* deploy-web/
          mkdir -p deploy-web/apps/web/.next
          cp -r apps/web/.next/static deploy-web/apps/web/.next/
          if [ -d "apps/web/public" ]; then
            cp -r apps/web/public deploy-web/apps/web/
          fi
          cat << 'EOF' > deploy-web/server.js
          process.env.NODE_ENV = 'production';
          process.env.PORT = process.env.PORT || 3000;
          process.env.API_URL = process.env.API_URL || 'https://api.akibatech.com';
          import('./apps/web/server.js');
          EOF
          node -e "
            const fs = require('fs');
            const file = 'deploy-web/package.json';
            const pkg = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
            pkg.type = 'module';
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
          "
          mkdir -p deploy-web/tmp
          touch deploy-web/tmp/restart.txt

      - name: Prepare API Deployment Package
        run: |
          mkdir -p deploy-api
          cp -r packages/database/drizzle deploy-api/drizzle

          cat << 'EOF' > deploy-api/migrate.js
          import { drizzle } from 'drizzle-orm/node-postgres';
          import { migrate } from 'drizzle-orm/node-postgres/migrator';
          import pg from 'pg';
          import fs from 'fs';
          import path from 'path';
          import { fileURLToPath } from 'url';

          const __dirname = path.dirname(fileURLToPath(import.meta.url));

          // Load from .env if DATABASE_URL is not set in environment
          if (!process.env.DATABASE_URL && fs.existsSync('.env')) {
            const lines = fs.readFileSync('.env', 'utf8').split('\n');
            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed && !trimmed.startsWith('#') && trimmed.includes('=')) {
                const [k, ...v] = trimmed.split('=');
                if (k.trim() === 'DATABASE_URL') {
                  process.env.DATABASE_URL = v.join('=').trim().replace(/^['"]|['"]$/g, '');
                }
              }
            }
          }

          const url = process.env.DATABASE_URL;
          if (!url) {
            console.error('[migrate] ERROR: DATABASE_URL environment variable is not set and not found in .env.');
            process.exit(1);
          }

          const client = new pg.Client({ connectionString: url });
          async function main() {
            console.log('[migrate] Connecting to database...');
            await client.connect();
            const db = drizzle(client);
            console.log('[migrate] Running pending migrations from ./drizzle...');
            await migrate(db, { migrationsFolder: path.join(__dirname, 'drizzle') });
            console.log('[migrate] All migrations applied successfully!');
            await client.end();
          }

          main().catch((err) => {
            console.error('[migrate] Migration failed:', err);
            process.exit(1);
          });
          EOF

          pnpm exec esbuild apps/api/dist/main.js \
            --bundle \
            --platform=node \
            --target=node22 \
            --format=esm \
            --outfile=deploy-api/server.js \
            --external:@nestjs/* \
            --external:bcryptjs \
            --external:drizzle-orm \
            --external:jsonwebtoken \
            --external:nodemailer \
            --external:pg \
            --external:reflect-metadata \
            --external:rxjs \
            --external:zod

          node -e "
            const fs = require('fs');
            const apiPkg = JSON.parse(fs.readFileSync('apps/api/package.json', 'utf8'));
            const dbPkg = JSON.parse(fs.readFileSync('packages/database/package.json', 'utf8'));
            const deps = { ...apiPkg.dependencies, ...dbPkg.dependencies };
            delete deps['@hub/database'];
            delete deps['@hub/shared'];
            const pkg = {
              name: 'hub-api',
              version: '1.0.0',
              type: 'module',
              main: 'server.js',
              scripts: {
                start: 'node server.js',
                migrate: 'node migrate.js'
              },
              dependencies: deps
            };
            fs.writeFileSync('deploy-api/package.json', JSON.stringify(pkg, null, 2));
          "

          cd deploy-api && npm install --omit=dev --no-audit --no-fund
          cd ..

          mkdir -p deploy-api/tmp
          touch deploy-api/tmp/restart.txt

      - name: Deploy Web to cPanel (hub-web)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./deploy-web/
          server-dir: hub-web/

      - name: Deploy API to cPanel (hub-api)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local-dir: ./deploy-api/
          server-dir: hub-api/
